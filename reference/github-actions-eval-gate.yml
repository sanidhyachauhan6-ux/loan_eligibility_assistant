name: eval-gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start loan eligibility API
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          docker compose up -d --build model litellm api

          timeout 300 sh -c \
            'until curl -fsS http://localhost:8001/health; do sleep 5; done'

      - name: Run prompt evaluation gate
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          npx --yes promptfoo@latest eval \
            -c promptfooconfig.yaml \
            --no-cache

      - name: Publish evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promptfoo-eval-report
          path: eval-report.json